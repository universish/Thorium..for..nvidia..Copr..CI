# ==============================================================================
# SIFIR GÜVEN (ZERO-TRUST) TEDARİK ZİNCİRİ VE ARKA KAPI DENETİM POLİTİKASI
# ==============================================================================
# Açık kaynak kodlu yazılımların doğrudan kaynak kodlarında zararlı kod bulunma
# ihtimali görece düşük olsa da, 2024 yılında yaşanan XZ Utils (CVE-2024-3094)
# tedarik zinciri operasyonunda görüldüğü üzere; devlet destekli siber istihbarat
# birimleri (başta Mossad ve İsrail siber ordusu / Unit 8200 gibi saldırgan
# odaklar) ile siyonizm, faşizm ve ırkçılık güdümlü kötücül aktörler, açık
# kaynak projelerin bakımcılık (maintainer) görevlerine sızabilmektedir.
#
# Bu tür operasyonlarda saldırganlar çoğu zaman gerçek kimliklerini gizleyerek
# kendilerini Çin veya Hong Kong kökenli bağımsız geliştiriciler ("Jia Tan"
# vakasında olduğu gibi) şeklinde tanıtarak güven kazanmakta ve arka kapıları
# doğrudan incelenebilir kaynak koduna değil, önceden derlenmiş (pre-built)
# GitHub Releases ikili paketlerine (.rpm, .deb, .AppImage) enjekte etmektedir.
#
# Upstream kaynaklarına yönelik Sıfır Güven (Zero-Trust) değerlendirmemiz:
# 1. gz83 deposu: XZ operasyonundaki kimlik gizleme taktikleri göz önünde
#    bulundurularak, Doğu Asya / Çin / Hong Kong profiliyle sunulan derlenmiş
#    ikili paketlere koşulsuz güvenilmemekte; her sürüm bağımsız taramadan
#    geçirilmektedir.
# 2. Alex313031 deposu: ABD merkezli geliştirici profilinin, ABD iç siyasetindeki
#    MAGA eğilimleri ve siyonist politikalarla olası ideolojik/kurumsal
#    uyumluluk riskleri nedeniyle, yayınlanan derlenmiş paketler doğrudan
#    güvenilir kabul edilmemektedir.
#
# Bu nedenlerle iş akışımız; indirilen her derlenmiş paketi Fedora Copr
# deposuna göndermeden önce XZ tarzı arka kapı/ELF enjeksiyon analizinden,
# ClamAV yerel imza taramasından ve VirusTotal API v3 çoklu motor bulut
# sorgusundan geçirerek kullanıcı güvenliğini en üst düzeyde korur.
# ==============================================================================

name: Thorium Upstream Sync & Copr Builder

on:
  schedule:
    # 1. Hong Kong Öğle Arası (12:30 HKT / UTC+8)
    - cron: '30 4 * * *'
    # 2. Hong Kong İş Çıkışı (18:30 HKT / UTC+8)
    - cron: '30 10 * * *'
    # 3. ABD (Doğu Yakası) Öğle Arası (12:30 EST - 13:30 EDT)
    - cron: '30 17 * * *'
    # 4. ABD (Doğu Yakası) İş Çıkışı (17:30 EST - 18:30 EDT)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Yeni sürüm olmasa bile zorla yeniden paketle ve gönder'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: thorium-copr-sync
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. AŞAMA: Güncel Sürümün Yayınlanıp Yayınlanmadığının Kontrol Edilmesi
  # ============================================================================
  check-update:
    name: 1. Aşama - Güncel Sürüm Kontrolü
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.verify.outputs.has_update }}
      clean_version: ${{ steps.verify.outputs.clean_version }}
      download_url: ${{ steps.verify.outputs.download_url }}
      ext: ${{ steps.verify.outputs.ext }}
      release_num: ${{ steps.verify.outputs.release_num }}
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Upstream Sürümlerini Kontrol Et ve Karşılaştır
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build || 'false' }}
        run: |
          set -euo pipefail

          STATE_FILE="state.json"
          SAVED_VER="0.0.0.0"
          SAVED_NUM=0

          if [ -f "$STATE_FILE" ]; then
            SAVED_VER=$(jq -r '.version // "0.0.0.0"' "$STATE_FILE")
            SAVED_NUM=$(jq -r '.release // 0' "$STATE_FILE")
          fi

          echo "Depodaki kayıtlı sürüm: ${SAVED_VER} (Release: ${SAVED_NUM})"

          REPOS=("Alex313031/thorium" "gz83/thorium")
          FORMATS=("rpm" "AppImage" "deb" "zip")

          BEST_VER=""
          BEST_URL=""
          BEST_EXT=""

          for repo in "${REPOS[@]}"; do
            REL_JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null || true)

            if [ -z "$REL_JSON" ]; then
              continue
            fi

            LATEST_TAG=$(echo "$REL_JSON" | jq -r '.tag_name // empty')
            if [ -z "$LATEST_TAG" ]; then
              continue
            fi

            for fmt in "${FORMATS[@]}"; do
              ASSET_LINE=$(echo "$REL_JSON" | jq -r --arg pat "AVX2" --arg ext ".$fmt" \
                '.assets[]? | select(.name | test($pat; "i")) | select(.name | endswith($ext)) | "\(.browser_download_url)|\(.name)"' | head -n 1)

              if [ -n "$ASSET_LINE" ]; then
                CANDIDATE_URL="${ASSET_LINE%%|*}"
                CANDIDATE_NAME="${ASSET_LINE#*|}"

                CANDIDATE_VER=$(echo "${LATEST_TAG} ${CANDIDATE_NAME}" | grep -oE '[0-9]+(\.[0-9]+){2,}' | head -n 1 || true)
                if [ -z "$CANDIDATE_VER" ]; then
                  CANDIDATE_VER=$(echo "$LATEST_TAG" | sed 's/[^0-9.]*//g' | sed 's/^\.*//;s/\.*$//')
                fi

                if [ -n "$CANDIDATE_VER" ]; then
                  echo "${repo} üzerinde bulunan aday sürüm: ${CANDIDATE_VER} (${fmt})"
                  if [ -z "$BEST_VER" ]; then
                    BEST_VER="$CANDIDATE_VER"
                    BEST_URL="$CANDIDATE_URL"
                    BEST_EXT="$fmt"
                  else
                    HIGHEST_CANDIDATE=$(printf '%s\n%s\n' "$BEST_VER" "$CANDIDATE_VER" | sort -V | tail -n 1)
                    if [ "$HIGHEST_CANDIDATE" = "$CANDIDATE_VER" ] && [ "$CANDIDATE_VER" != "$BEST_VER" ]; then
                      BEST_VER="$CANDIDATE_VER"
                      BEST_URL="$CANDIDATE_URL"
                      BEST_EXT="$fmt"
                    fi
                  fi
                  break
                fi
              fi
            done
          done

          if [ -z "$BEST_VER" ] || [ -z "$BEST_URL" ]; then
            echo "Uygun bir upstream sürümü veya AVX2 paketi bulunamadı. İş akışı sonlandırılıyor."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "En güncel upstream sürümü: ${BEST_VER} (${BEST_EXT})"

          IS_NEW_VERSION="false"
          if [ "$BEST_VER" != "$SAVED_VER" ]; then
            NEWER_CHECK=$(printf '%s\n%s\n' "$SAVED_VER" "$BEST_VER" | sort -V | tail -n 1)
            if [ "$NEWER_CHECK" = "$BEST_VER" ]; then
              IS_NEW_VERSION="true"
            fi
          fi

          if [ "$IS_NEW_VERSION" = "true" ]; then
            BUILD_NUM=1
            echo "Yeni güncelleme doğrulandı: ${SAVED_VER} -> ${BEST_VER} (Release: ${BUILD_NUM}). İkinci aşamaya geçiliyor."
          elif [ "$FORCE_BUILD" = "true" ]; then
            BUILD_NUM=$((SAVED_NUM + 1))
            echo "Manuel zorlama (force_build) aktif: ${BEST_VER} (Release: ${BUILD_NUM}). İkinci aşamaya geçiliyor."
          else
            echo "Yeni güncelleme yayınlanmadı (Mevcut: ${SAVED_VER}, Upstream: ${BEST_VER}). İş akışı sonlandırılıyor."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_update=true" >> "$GITHUB_OUTPUT"
          echo "clean_version=$BEST_VER" >> "$GITHUB_OUTPUT"
          echo "download_url=$BEST_URL" >> "$GITHUB_OUTPUT"
          echo "ext=$BEST_EXT" >> "$GITHUB_OUTPUT"
          echo "release_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # 2. AŞAMA: GitHub Actions sanal makinesinde güvenlik taraması ve paketleme
  # Fedora konteyneri GitHub runner üzerinde çalışır; bu aşama COPR'da çalışmaz.
  # ============================================================================
  package-srpm:
    name: 2. Aşama - GitHub Actions Güvenlik Taraması ve SRPM Paketleme
    needs: check-update
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - name: Gerekli Paketleri ve Güvenlik Araçlarını Yükle
        run: |
          dnf install -y git curl jq cpio rpm-build rpmdevtools binutils elfutils file p7zip tar zstd gzip python3 desktop-file-utils clamav clamav-update

      - name: Git Güvenli Dizin Yapılandırması
        run: |
          git config --global --add safe.directory '*'

      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: RPM / Kaynak Dosyasını İndir ve Aç
        env:
          URL: ${{ needs.check-update.outputs.download_url }}
          EXT: ${{ needs.check-update.outputs.ext }}
        run: |
          set -euo pipefail
          mkdir -p payload extract_dir

          echo "İndiriliyor: $URL"
          curl -fSL "$URL" -o "payload/upstream.$EXT"
          cd extract_dir

          case "$EXT" in
            rpm)
              if command -v rpm2cpio >/dev/null 2>&1; then
                rpm2cpio ../payload/upstream.rpm | cpio -idm --quiet
              else
                rpm2archive ../payload/upstream.rpm | tar -xzf -
              fi
              ;;
            deb)
              ar x ../payload/upstream.deb
              tar -xf data.tar.*
              ;;
            AppImage)
              chmod +x ../payload/upstream.AppImage
              ../payload/upstream.AppImage --appimage-extract
              mv squashfs-root/* .
              ;;
            zip)
              7z x ../payload/upstream.zip
              ;;
          esac

          if [ -d opt/chromium.org/thorium ]; then
            mkdir -p root_payload && mv opt/chromium.org/thorium/* root_payload/
          elif [ -d opt/thorium-browser ]; then
            mkdir -p root_payload && mv opt/thorium-browser/* root_payload/
          else
            mkdir -p root_payload
            find . -mindepth 1 -maxdepth 1 ! -name root_payload -exec mv -t root_payload/ {} +
          fi
          cd ..

      - name: GitHub Actions üzerinde ClamAV İmzalarını Güncelle (Zorunlu)
        run: |
          set -euo pipefail
          sed -i 's/^Example/#Example/' /etc/freshclam.conf
          freshclam

      - name: GitHub Actions üzerinde Arka Kapı, ClamAV ve VirusTotal Taraması
        env:
          EXT: ${{ needs.check-update.outputs.ext }}
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="payload/upstream.${EXT}"
          PAYLOAD_DIR="extract_dir/root_payload"

          echo "=================================================================="
          echo "[1/3] XZ Utils (CVE-2024-3094) Tarzı Arka Kapı ve ELF Analizi"
          echo "=================================================================="
          # 1. Kabuk betiklerinde gizli LD_PRELOAD, LD_AUDIT veya base64/eval arka kapı araması
          while IFS= read -r -d '' script_file; do
            if grep -Eiq '(LD_PRELOAD|LD_AUDIT|base64[[:space:]]+-d|eval[[:space:]]+"\$\(|curl[[:space:]]+.*\|[[:space:]]*(ba)?sh|wget[[:space:]]+.*\|[[:space:]]*(ba)?sh|/dev/tcp/)' "$script_file"; then
              echo "KRİTİK GÜVENLİK UYARISI: Şüpheli arka kapı dizgesi tespit edildi: $script_file"
              grep -Ein '(LD_PRELOAD|LD_AUDIT|base64[[:space:]]+-d|eval[[:space:]]+"\$\(|curl[[:space:]]+.*\|[[:space:]]*(ba)?sh|wget[[:space:]]+.*\|[[:space:]]*(ba)?sh|/dev/tcp/)' "$script_file" || true
              exit 1
            fi
          done < <(find "$PAYLOAD_DIR" -type f \( -name "*.sh" -o -name "thorium-browser" -o -name "google-chrome*" \) -exec file {} + | grep -i "script" | cut -d: -f1 | tr '\n' '\0')

          # 2. ELF ikili dosyalarında şüpheli RPATH/RUNPATH (/tmp, /var/tmp, /home) denetimi
          while IFS= read -r -d '' elf_file; do
            RPATH_INFO=$(readelf -d "$elf_file" 2>/dev/null | grep -E '(RPATH|RUNPATH)' || true)
            if echo "$RPATH_INFO" | grep -Eq '(/tmp|/var/tmp|/dev/shm|/home/)'; then
              echo "KRİTİK GÜVENLİK UYARISI: ELF dosyasında güvensiz RPATH/RUNPATH enjeksiyonu bulundu: $elf_file"
              echo "$RPATH_INFO"
              exit 1
            fi
          done < <(find "$PAYLOAD_DIR" -type f -exec file {} + | grep -i "ELF" | cut -d: -f1 | tr '\n' '\0')
          echo "Heuristik arka kapı ve ELF bütünlük kontrolü başarıyla tamamlandı."

          echo "=================================================================="
          echo "[2/3] ClamAV Yerel İmza ve Zararlı Yazılım Taraması"
          echo "=================================================================="
          # Büyük Chromium ikililerini varsayılan boyut sınırı nedeniyle atlama.
          # Tarama sınırına ulaşılması da başarısızlık sayılır.
          clamscan -r -i --max-filesize=2000M --max-scansize=4000M \
            --alert-exceeds-max=yes "$ARCHIVE_PATH" "$PAYLOAD_DIR"
          echo "ClamAV taraması temiz tamamlandı."

          echo "=================================================================="
          echo "[3/3] VirusTotal API v3 Çoklu Motor Sorgusu ve İkili Tarama"
          echo "=================================================================="
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "KRİTİK HATA: VIRUSTOTAL_API_KEY tanımlı değil! Güvenlik politikası gereği VirusTotal doğrulaması zorunludur."
            echo "Lütfen GitHub depo ayarlarından (Settings -> Secrets and variables -> Actions) VIRUSTOTAL_API_KEY anahtarını ekleyin."
            exit 1
          fi

          check_virustotal() {
            local target_file="$1"
            local label="$2"
            local sha256
            sha256=$(sha256sum "$target_file" | awk '{print $1}')
            echo "-> [$label] Dosya: $target_file | SHA-256: $sha256"

            local http_code
            http_code=$(curl -s -o vt_response.json -w "%{http_code}" \
              -H "x-apikey: ${VT_API_KEY}" \
              "https://www.virustotal.com/api/v3/files/${sha256}")

            if [ "$http_code" = "200" ]; then
              local malicious suspicious harmless undetected
              malicious=$(jq -er '.data.attributes.last_analysis_stats.malicious | select(type == "number" and . >= 0 and floor == .)' vt_response.json)
              suspicious=$(jq -r '.data.attributes.last_analysis_stats.suspicious // 0' vt_response.json)
              harmless=$(jq -r '.data.attributes.last_analysis_stats.harmless // 0' vt_response.json)
              undetected=$(jq -r '.data.attributes.last_analysis_stats.undetected // 0' vt_response.json)

              echo "   VirusTotal Sonucu ($label): Zararlı=$malicious, Şüpheli=$suspicious, Temiz=$harmless, Tespit Yok=$undetected"
              if [ "$malicious" -gt 0 ]; then
                echo "KRİTİK GÜVENLİK İHLALİ: VirusTotal üzerinde [$label] için $malicious güvenlik motoru zararlı yazılım/arka kapı tespit etti!"
                jq -r '.data.attributes.last_analysis_results | to_entries[] | select(.value.category == "malicious") | "   - \(.key): \(.value.result)"' vt_response.json || true
                exit 1
              fi
            elif [ "$http_code" = "404" ]; then
              echo "   [$label] SHA-256 özeti henüz VirusTotal veritabanında yok. Dosya doğrudan VirusTotal'a yükleniyor..."
              local file_size
              file_size=$(stat -c%s "$target_file")
              local upload_url="https://www.virustotal.com/api/v3/files"

              if [ "$file_size" -gt 33554432 ]; then
                echo "   Dosya boyutu 32 MB üzerinde ($file_size bayt), büyük dosya yükleme adresi alınıyor..."
                upload_url=$(curl -fsSL -H "x-apikey: ${VT_API_KEY}" "https://www.virustotal.com/api/v3/files/upload_url" | jq -r '.data // empty')
              fi

              if [ -n "$upload_url" ] && [ "$file_size" -lt 681574400 ]; then
                local analysis_id
                analysis_id=$(curl -fsSL -X POST "$upload_url" \
                  -H "x-apikey: ${VT_API_KEY}" \
                  -F "file=@${target_file}" | jq -r '.data.id // empty')

                if [ -n "$analysis_id" ]; then
                  echo "   Yükleme başarılı (Analiz ID: $analysis_id). Analiz sonucu bekleniyor..."
                  for attempt in {1..18}; do
                    sleep 20
                    curl -fsSL -H "x-apikey: ${VT_API_KEY}" \
                      "https://www.virustotal.com/api/v3/analyses/${analysis_id}" -o vt_analysis.json
                    local status
                    status=$(jq -r '.data.attributes.status // empty' vt_analysis.json)
                    echo "   Deneme ${attempt}/18 - Durum: ${status}"
                    if [ "$status" = "completed" ]; then
                      local mal_count
                      mal_count=$(jq -er '.data.attributes.stats.malicious | select(type == "number" and . >= 0 and floor == .)' vt_analysis.json)
                      echo "   VirusTotal Analizi Tamamlandı ($label): Zararlı=$mal_count"
                      if [ "$mal_count" -gt 0 ]; then
                        echo "KRİTİK GÜVENLİK İHLALİ: Yüklenen [$label] dosyasında zararlı yazılım tespit edildi!"
                        exit 1
                      fi
                      return 0
                    fi
                  done
                  echo "KRİTİK HATA: [$label] VirusTotal analizi zamanında tamamlanmadı. COPR'a gönderim durduruldu."
                  exit 1
                else
                  echo "KRİTİK HATA: [$label] VirusTotal analiz kimliği alınamadı."
                  exit 1
                fi
              else
                echo "KRİTİK HATA: [$label] VirusTotal'a yüklenemedi (boyut sınırı veya eksik yükleme URL'si)."
                exit 1
              fi
            else
              echo "KRİTİK HATA: VirusTotal API beklenmeyen bir HTTP kodu döndürdü: $http_code"
              cat vt_response.json || true
              exit 1
            fi
          }

          # 1. İndirilen upstream paketini (RPM / arşiv) VirusTotal ile doğrula
          check_virustotal "$ARCHIVE_PATH" "Upstream-Paketi"

          # 2. Paket içinden çıkan ana Thorium ELF ikili dosyasını VirusTotal ile doğrula
          MAIN_BIN=""
          for candidate in "$PAYLOAD_DIR/thorium" "$PAYLOAD_DIR/chrome" "$PAYLOAD_DIR/thorium-browser"; do
            if [ -f "$candidate" ] && file "$candidate" | grep -qi "ELF"; then
              MAIN_BIN="$candidate"
              break
            fi
          done

          if [ -n "$MAIN_BIN" ]; then
            check_virustotal "$MAIN_BIN" "Ana-Thorium-ELF-Binary"
          else
            echo "KRİTİK HATA: VirusTotal ile doğrulanacak ana Thorium ELF dosyası bulunamadı."
            exit 1
          fi

          echo "Tüm güvenlik, arka kapı, ClamAV ve VirusTotal kontrolleri başarıyla geçildi."

      - name: Desktop Dosyasını Akıllı Denetle ve Güncelle
        run: |
          python3 - << 'EOF'
          import glob

          target_exec = "env NVD_BACKEND=direct __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia /usr/bin/thorium-browser --ozone-platform=x11 --enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoEncoderLinuxGL --ignore-gpu-blocklist --enable-zero-copy --use-gl=angle --use-angle=gl"

          desktop_matches = glob.glob('extract_dir/**/*.desktop', recursive=True)
          output_desktop = 'thorium-browser.desktop'

          if desktop_matches:
              src_desktop = desktop_matches[0]
              with open(src_desktop, 'r', encoding='utf-8', errors='ignore') as f:
                  lines = f.readlines()

              updated_lines = []
              for line in lines:
                  if line.strip().startswith('Exec='):
                      parts = line.strip().split('Exec=', 1)[1].strip()
                      extra_flags = ""
                      for flag in ['%U', '%u', '--incognito', '--temp-profile', '--safe-mode', '--force-dark-mode']:
                          if flag in parts and flag not in extra_flags:
                              extra_flags += f" {flag}"
                      updated_lines.append(f"Exec={target_exec}{extra_flags}\n")
                  else:
                      updated_lines.append(line)

              with open(output_desktop, 'w', encoding='utf-8') as f:
                  f.writelines(updated_lines)
          else:
              full_content = f"""[Desktop Entry]
          Version=1.0
          Name=Thorium
          GenericName=Web Browser
          Comment=Access the Internet
          Exec={target_exec} %U
          StartupNotify=true
          Terminal=false
          Icon=thorium-browser
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          Actions=new-window;new-private-window;temp-profile;safe-mode;dark-mode;

          [Desktop Action new-window]
          Name=New Window
          Exec={target_exec} %U

          [Desktop Action new-private-window]
          Name=New Incognito Window
          Exec={target_exec} --incognito %U

          [Desktop Action temp-profile]
          Name=Open New Window with a temporary profile
          Exec={target_exec} --temp-profile %U

          [Desktop Action safe-mode]
          Name=Open in Safe Mode
          Exec={target_exec} --safe-mode %U

          [Desktop Action dark-mode]
          Name=Open in Dark Mode
          Exec={target_exec} --force-dark-mode %U
          """
              clean_content = "\n".join([line.lstrip() for line in full_content.strip().splitlines()]) + "\n"
              with open(output_desktop, 'w', encoding='utf-8') as f:
                  f.write(clean_content)
          EOF

      - name: Fedora Copr Spec ile Yeniden Paketle (SRPM)
        env:
          CLEAN_VERSION: ${{ needs.check-update.outputs.clean_version }}
          RELEASE_NUM: ${{ needs.check-update.outputs.release_num }}
        run: |
          set -euo pipefail
          cd extract_dir/root_payload
          tar -czf ../../upstream-payload.tar.gz .
          cd ../..

          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp upstream-payload.tar.gz ~/rpmbuild/SOURCES/
          cp thorium-launcher.sh ~/rpmbuild/SOURCES/
          cp thorium-browser.desktop ~/rpmbuild/SOURCES/
          cp thorium-browser.metainfo.xml ~/rpmbuild/SOURCES/

          if [ -f specs/thorium-browser.spec ]; then
            cp specs/thorium-browser.spec ~/rpmbuild/SPECS/thorium-browser.spec
          else
            cp thorium-browser.spec ~/rpmbuild/SPECS/thorium-browser.spec
          fi

          SPEC_FILE=~/rpmbuild/SPECS/thorium-browser.spec
          sed -i "s/^Version:.*/Version:        ${CLEAN_VERSION}/" "$SPEC_FILE"
          sed -i "s/^Release:.*/Release:        ${RELEASE_NUM}%{?dist}/" "$SPEC_FILE"

          rpmbuild -bs "$SPEC_FILE"

          mkdir -p out
          cp ~/rpmbuild/SRPMS/*.src.rpm out/

      - name: Hazırlanan SRPM Paketini Üçüncü Aşamaya Aktar
        uses: actions/upload-artifact@v4
        with:
          name: thorium-srpm
          path: out/*.src.rpm
          retention-days: 1
          compression-level: 0

  # ============================================================================
  # 3. AŞAMA: Fedora Copr Deposuna Gönderilip Yayınlanması ve Durum Güncellemesi
  # ============================================================================
  publish-copr:
    name: 3. Aşama - Copr Yayınlama ve Durum Kaydı
    needs: [check-update, package-srpm]
    if: needs.check-update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    steps:
      - name: Gerekli Paketleri Yükle
        run: |
          dnf install -y git jq copr-cli

      - name: Git Güvenli Dizin Yapılandırması
        run: |
          git config --global --add safe.directory '*'

      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SRPM Paketini Al
        uses: actions/download-artifact@v4
        with:
          name: thorium-srpm
          path: out

      - name: Fedora Copr Deposuna Gönder ve Yayınla
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          SRPM_FILE=$(ls out/*.src.rpm | head -n 1)
          echo "Copr'a gönderiliyor: $SRPM_FILE"
          copr-cli build universish/Thorium "$SRPM_FILE"

      - name: Sürüm Durumunu (state.json) Güncelle ve Kaydet
        env:
          CURR_VER: ${{ needs.check-update.outputs.clean_version }}
          BUILD_NUM: ${{ needs.check-update.outputs.release_num }}
        run: |
          set -euo pipefail
          STATE_FILE="state.json"
          echo "{\"version\": \"$CURR_VER\", \"release\": $BUILD_NUM}" > "$STATE_FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "chore(release): update state to ${CURR_VER}-${BUILD_NUM}" || echo "Değişiklik yok"
          git push origin HEAD:${{ github.ref_name }}
