name: Publish CentOS Stream 8 RPMs to EPEL Next 8

on:
  workflow_dispatch:
    inputs:
      x86_build_id:
        description: 'Scanned x86_64 Copr build with a successful centos-stream-8-x86_64 result'
        required: true
        default: '11206594'
      arm_build_id:
        description: 'Scanned aarch64 Copr build with a successful centos-stream-8-aarch64 result'
        required: true
        default: '11206595'

permissions:
  contents: read

jobs:
  publish-prebuilt:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Copr tools
        run: dnf install -y copr-cli curl jq rpm

      - name: Publish already built RPMs without running scans on Copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          X86_BUILD_ID: ${{ inputs.x86_build_id }}
          ARM_BUILD_ID: ${{ inputs.arm_build_id }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr

          for arch in x86_64 aarch64; do
            if [ "$arch" = x86_64 ]; then
              build_id="$X86_BUILD_ID"
            else
              build_id="$ARM_BUILD_ID"
            fi
            source_chroot="centos-stream-8-${arch}"
            target_chroot="centos-stream+epel-next-8-${arch}"

            build_json=$(curl -fsSL --retry 3 \
              "https://copr.fedorainfracloud.org/api_3/build/${build_id}")
            jq -e --arg id "$build_id" --arg chroot "$source_chroot" \
              '.id == ($id | tonumber) and .ownername == "universish" and .projectname == "Thorium" and .source_package.name == "thorium-browser" and (.chroots | index($chroot) != null)' \
              <<< "$build_json" > /dev/null

            source_json=$(curl -fsSL --retry 3 --get \
              --data-urlencode "build_id=${build_id}" \
              --data-urlencode "chrootname=${source_chroot}" \
              'https://copr.fedorainfracloud.org/api_3/build-chroot')
            jq -e '.state == "succeeded"' <<< "$source_json" > /dev/null
            result_url=$(jq -er '.result_url' <<< "$source_json")
            results_json=$(curl -fsSL --retry 3 "${result_url}results.json")
            rpm_name=$(jq -er --arg arch "$arch" \
              '.packages[] | select(.name == "thorium-browser" and .arch == $arch) | "\(.name)-\(.version)-\(.release).\(.arch).rpm"' \
              <<< "$results_json")
            curl -fSL --retry 3 "${result_url}${rpm_name}" -o "$rpm_name"
            [ "$(rpm -qp --qf '%{ARCH}' "$rpm_name")" = "$arch" ]
            rpm_version=$(rpm -qp --qf '%{VERSION}' "$rpm_name")
            rpm_release=$(rpm -qp --qf '%{RELEASE}' "$rpm_name")
            mkdir -p "upload-${arch}"
            mv "$rpm_name" "upload-${arch}/"
            tar -czf "upload-${arch}.tar.gz" "upload-${arch}"
            echo "${rpm_name} -> ${target_chroot}"
            copr-cli uploadrpm --nowait universish/Thorium "upload-${arch}.tar.gz" \
              --name thorium-browser --version "$rpm_version" --release "$rpm_release" \
              --chroot "$target_chroot"
          done
